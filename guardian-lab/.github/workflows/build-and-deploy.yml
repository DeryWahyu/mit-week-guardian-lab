name: Publish and deploy Guardian Lab

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Update the Ansible-managed stack after publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: guardian-lab-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: derywahyu/guardian-lab

jobs:
  images:
    if: github.ref == 'refs/heads/main' && github.repository == 'DeryWahyu/guardian-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: guardian-lab
            dockerfile: docker/app/Dockerfile
            target: runner
          - image: guardian-lab-broker
            dockerfile: docker/sandbox/broker/Dockerfile
            target: ""
          - image: guardian-sandbox-web
            dockerfile: docker/sandbox/web/Dockerfile
            target: ""
          - image: guardian-sandbox-egress
            dockerfile: docker/sandbox/egress/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish commit image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/derywahyu/${{ matrix.image }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/DeryWahyu/guardian-lab
          build-args: NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://guardian-lab.alfian-gading.my.id' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the complete image group
        run: |
          set -euo pipefail
          for image in guardian-lab guardian-lab-broker guardian-sandbox-web guardian-sandbox-egress; do
            docker buildx imagetools create \
              --tag "ghcr.io/derywahyu/${image}:latest" \
              "ghcr.io/derywahyu/${image}:sha-${GITHUB_SHA}"
          done

  deploy:
    needs: release
    if: vars.ENABLE_VPS_DEPLOY == 'true' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_KEY: ${{ secrets.VPS_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Update the web and sandbox images under the server deployment lock
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST}" "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_KEY:?Missing VPS_KEY}" "${VPS_KNOWN_HOSTS:?Missing trusted host keys}"
          umask 077
          ssh_dir=$(mktemp -d "${RUNNER_TEMP}/guardian-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" -p "${VPS_SSH_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            "${VPS_USER}@${VPS_HOST}" bash -s -- web "sha-${GITHUB_SHA}" <<'REMOTE'
          set -euo pipefail
          cd /opt/docker-stack/applications/guardian-lab
          ./update.sh "$1" "$2"
          REMOTE
