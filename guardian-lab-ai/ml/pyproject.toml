[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-ml"
version = "0.1.0"
description = "Frozen Logistic Regression v6 for offline URL-only shadow inference"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib==1.5.3",
  "numpy==2.4.3",
  "pandas==2.2.3",
  "requests==2.32.3",
  "scikit-learn==1.8.0",
  "scipy==1.16.3",
  "tldextract==5.3.0",
  "threadpoolctl==3.6.0",
  "requests-file==3.0.1",
  "filelock==3.16.1",
  "urllib3==2.2.1",
  "idna==3.7",
  "certifi==2024.2.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.3", "httpx==0.28.1"]
dev = ["ruff==0.14.3"]
evaluation = ["pyarrow==22.0.0"]
quality = ["pyarrow==22.0.0", "matplotlib==3.10.8"]
notebook = ["ipykernel==7.1.0", "nbclient==0.10.4", "nbformat==5.10.4"]
serve = ["fastapi==0.136.1", "starlette==1.0.0", "uvicorn==0.47.0", "pydantic==2.13.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
